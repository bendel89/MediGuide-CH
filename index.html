<style>
:root{--bg:#f1f6f8;--card:#fff;--tx:#18262c;--mu:#667a83;--ac:#0e8f8a;--bd:#dde8ec;--r3:#dc2626;--r2:#d97706;--r1:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1518;--card:#172226;--tx:#e8f1f3;--mu:#9bb0b8;--bd:#263840}}
*{box-sizing:border-box}
html,body{margin:0;background:linear-gradient(160deg,#d3f0ec,var(--bg) 40%,#e4eafb) fixed;color:var(--tx);font:17px/1.45 -apple-system,system-ui,Helvetica,sans-serif}
@media(prefers-color-scheme:dark){html,body{background:linear-gradient(160deg,#0f2a2a,var(--bg) 40%,#141a2e) fixed}}
main{max-width:640px;margin:0 auto;padding:12px 14px 100px}
h1{font-size:25px;margin:6px 0 4px}h2{font-size:17px;margin:0 0 6px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 6px 18px rgba(14,143,138,.10)}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px;width:100%;margin:4px 0}
button{background:linear-gradient(135deg,var(--ac),#2563eb);color:#fff;border:0;font-weight:600}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px}.row>*{flex:1}
.mu{color:var(--mu);font-size:14px}
.item{display:flex;align-items:center;gap:10px;cursor:pointer}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:5px 12px;margin:3px 3px 3px 0;font-size:14px;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.note{background:rgba(14,143,138,.1);border-radius:10px;padding:8px;margin-top:8px;font-size:15px}
.ix{border-left:6px solid;border-radius:12px;padding:10px;margin:8px 0;background:var(--card)}
.l3{border-color:var(--r3)}.l2{border-color:var(--r2)}.l1{border-color:var(--r1)}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;color:#fff;margin-left:6px}
.t3{background:var(--r3)}.t2{background:var(--r2)}.t1{background:var(--r1)}
a.call{display:block;background:var(--r3);color:#fff;text-align:center;text-decoration:none;border-radius:12px;padding:13px;font-weight:600;margin-bottom:6px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:var(--card);box-shadow:0 -4px 20px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;color:var(--mu);border-radius:0;font-size:11px;padding:8px 6px;margin:0;flex:1 0 auto;min-width:68px;width:auto}
nav button.on{color:var(--ac)}nav span{display:block;font-size:22px}
</style>
</head>

["mille","statinecyp",2,"Peut réduire l'effet de la statine."],
["statinecyp","pamp",2,"De grandes quantités de jus de pamplemousse augmentent le taux de statine : douleurs musculaires possibles."],
["levo","ipp",2,"Les IPP peuvent réduire l'absorption de la lévothyroxine : contrôle de la TSH conseillé."],
["bb","beta2",2,"Les bêtabloquants peuvent affaiblir l'effet du salbutamol et gêner les asthmatiques."],
["valpro","lamo",3,"Le valproate augmente fortement le taux de lamotrigine : risque d'éruption grave. Dose à adapter par le médecin."],
["pilule","lamo",2,"Les œstrogènes peuvent diminuer le taux de lamotrigine."],
["cortico","metf",2,"Les corticoïdes font monter la glycémie et peuvent contrarier la metformine."],
["cortico","fq",3,"Risque accru de tendinites et de ruptures de tendon."],
["cortico","anticoag",2,"Risque de saignements et variations de l'effet anticoagulant."],
["stim","snri",2,"Cumul d'effets sur la tension et le pouls."],
["tca","isrs",2,"Un ISRS peut augmenter le taux de l'amitriptyline : effets indésirables accrus."],
["anticholi","anticholi",2,"Cumul d'effets anticholinergiques : bouche sèche, constipation, difficultés à uriner, confusion (surtout chez les aînés)."]
];
const C=[
["Mal de tête","mal de tete cephalee tete","Paracétamol,Ibuprofène,Acide","Mal de tête brutal et violent, avec fièvre, raideur de la nuque, trouble de la vision ou de la parole : urgence 144. Plus de quelques jours par mois : consulte (risque de maux de tête de rebond)."],
["Migraine","migraine aura crise","Sumatriptan,Ibuprofène,Paracétamol","Si les crises sont fréquentes, un médecin peut proposer un traitement de fond."],
["Douleurs (dos, muscles, articulations)","douleur mal de dos lombalgie muscle articulation arthrose entorse courbature","Paracétamol,Ibuprofène,Diclofénac,Métamizole","Bouge dès que possible. Anti-inflammatoires : le moins longtemps possible, avec un repas."],
["Règles douloureuses","regles douloureuses dysmenorrhee crampes","Ibuprofène,Diclofénac,Butylscopolamine,Contraceptif","Douleurs très fortes ou nouvelles : consulte (endométriose possible)."],
["Fièvre","fievre temperature","Paracétamol,Ibuprofène","Bébé de moins de 3 mois, fièvre très élevée, raideur de nuque ou fièvre depuis plus de 3 jours : consulte."],
["Rhume / grippe","rhume grippe enrhume nez qui coule courbature","Paracétamol,Ibuprofène,Xylométazoline,Dextrométhorphane,Ambroxol","Un virus ne se soigne pas avec des antibiotiques. Repos, boissons, lavage du nez."],
["Toux","toux seche toux grasse bronchite","Dextrométhorphane,Ambroxol","Toux sèche : antitussif. Toux grasse : fluidifiant. Si elle dure plus de 2 à 3 semaines, consulte."],
["Nez bouché","nez bouche sinusite congestion","Xylométazoline","Maximum quelques jours."],
["Allergies","allergie rhume des foins pollen urticaire demangeaison rhinite","Cétirizine,Prednisone","Gonflement du visage ou de la gorge, difficulté à respirer : urgence 144."],
["Asthme","asthme essoufflement sifflement","Salbutamol,Prednisone","Un traitement de fond est souvent nécessaire : parles-en à ton médecin."],
["Brûlures d'estomac / reflux","reflux brulure estomac acidite gastrite ulcere","Pantoprazole","Évite les repas copieux et tardifs, l'alcool, le tabac. Brûlures fréquentes : bilan médical."],
["Nausées / vomissements","nausee vomissement mal au coeur","Dompéridone","Vomissements prolongés ou signes de déshydratation : consulte."],
["Diarrhée","diarrhee gastro","Lopéramide","Bois beaucoup. Pas de lopéramide en cas de fièvre ou de sang dans les selles."],
["Constipation","constipation transit","Macrogol","Fibres, eau et mouvement aident."],
["Mal de ventre","mal de ventre douleur abdominale crampes colique","Butylscopolamine,Paracétamol,Métamizole","Douleur intense, fièvre, ventre dur ou vomissements : consulte rapidement (144 si très fort)."],
["Dépression","depression deprime tristesse moral bas","Sertraline,Escitalopram,Venlafaxine,Mirtazapine,Amitriptyline,Millepertuis","L'effet complet demande 2 à 4 semaines. Ne pas arrêter seul. Si tu as des idées de mourir ou de te faire du mal, appelle le 143 ou le 144."],
["Anxiété / angoisse","anxiete angoisse stress panique phobie","Sertraline,Escitalopram,Lorazépam","Benzodiazépines : courte durée seulement (risque de dépendance). La psychothérapie est très efficace."],
["Insomnie","insomnie sommeil dormir","Mélatonine,Zolpidem,Mirtazapine,Lorazépam","D'abord : heures régulières, écrans éteints, pas de caféine le soir. Somnifères : courte durée."],
["TDAH","tdah adhd attention hyperactivite concentration","Méthylphénidate","Suivi par un spécialiste. La prise en charge comprend aussi des mesures éducatives et psychologiques."],
["Trouble bipolaire","bipolaire manie maniaco depression humeur","Lithium,Valproate,Lamotrigine,Quétiapine","Traitement strictement encadré par le psychiatre."],
["Psychose / schizophrénie","psychose schizophrenie delire hallucination","Quétiapine","Traitement et suivi par un psychiatre."],
["Épilepsie","epilepsie convulsions crises","Lamotrigine,Valproate","Ne jamais arrêter un antiépileptique seul : risque de crise."],
["Tension élevée","hypertension tension arterielle","Ramipril,Amlodipine,Métoprolol","Souvent sans symptôme : contrôles réguliers."],
["Cholestérol","cholesterol lipides","Atorvastatine","L'alimentation et l'activité aident beaucoup."],
["Diabète de type 2","diabete sucre glycemie","Metformine","L'alimentation et le mouvement restent la base."],
["Thyroïde","thyroide hypothyroidie fatigue froid","Lévothyroxine","Contrôle sanguin (TSH) régulier."],
["Infections bactériennes","infection angine otite cystite bronchite sinusite dent","Amoxicilline,Ciprofloxacine","Seul un médecin décide d'un antibiotique."],
["Anticoagulation / caillots","caillot thrombose phlebite embolie fibrillation anticoagulant","Phenprocoumon,Apixaban","Jambe douloureuse et gonflée, essoufflement soudain, douleur thoracique : 144."],
["Contraception","contraception pilule","Contraceptif","Un médecin ou le planning familial aide à choisir la méthode adaptée."],
["Inflammation sévère","inflammation polyarthrite eczema severe","Prednisone","Traitement court si possible."],
["Douleur forte","douleur forte intense post operatoire","Tramadol,Métamizole","Sur ordonnance. Prudence : dépendance possible."],
["Arthrose","arthrose articulation genou hanche","Paracétamol,Ibuprofène,Diclofénac","Mouvement et renforcement musculaire aident."]
];
const di=n=>D.findIndex(d=>nz(d[0]).startsWith(nz(n)));
const sn=i=>D[i][0].split(" /")[0];
const FOOT='<div class="mu" style="margin:14px 0">ℹ️ Information générale, pas un avis médical. Ne commence, ne change et n\'arrête jamais un traitement sans en parler à ton médecin ou pharmacien. Les catégories de remise sont indicatives.</div>';
const TABS=[["rech","🔍","Recherche"],["liste","📚","Liste"],["inter","⚡","Interactions"],["lgt","⏳","Long terme"],["my","⭐","Ma liste"],["aide","🆘","Aide"]];
function go(t){tab=t;det=null;render();scrollTo(0,0)}
function op(i){det=i;render();scrollTo(0,0)}
function render(){$("nav").innerHTML=TABS.map(t=>`<button class="${tab==t[0]&&det===null?"on":""}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join("");$("app").innerHTML=(det!==null?detail(det):({rech,liste,inter,lgt,my,aide})[tab]())+FOOT}
function row(i){const d=D[i];return `<div class="card item" onclick="op(${i})"><div style="flex:1"><b>${esc(d[0])}</b><div class="mu">${esc(d[2])} · ${esc(d[1])}</div></div><span class="chip">${esc(d[9])}</span></div>`}

/* RECHERCHE */
const hit=(h,q)=>q.split(" ").filter(Boolean).every(w=>h.includes(w));
function results(q){q=nz(q).trim();if(q.length<2)return '<div class="mu">Tape au moins 2 lettres : un symptôme, une maladie, un médicament ou une marque.</div>';
 let o="";
 C.forEach(c=>{if(hit(nz(c[0]+" "+c[1]),q)){o+=`<div class="card"><h2>🩺 ${esc(c[0])}</h2><div class="mu">Médicaments souvent utilisés :</div>${c[2].split(",").map(n=>{const i=di(n);return i<0?"":`<span class="chip" onclick="op(${i})">${esc(sn(i))}</span>`}).join("")}<div class="note">${esc(c[3])}</div></div>`}});
 D.forEach((d,i)=>{if(hit(nz(d[0]+" "+d[1]+" "+d[2]+" "+d[3]),q))o+=row(i)});
 return o||'<div class="card mu">Aucun résultat. Essaie un autre mot (ex. « tête », « estomac », « sommeil »).</div>'}
function ds(){Q=$("q").value;$("res").innerHTML=results(Q)}
function qs(t){$("q").value=t;ds()}
function rech(){setTimeout(ds,0);return `<h1>💊 MediGuide CH</h1><div class="mu">Cherche un symptôme, une maladie, un médicament ou une marque.</div><input id="q" placeholder="🔍 Ex. : dépression, mal de tête, Dafalgan…" value="${esc(Q)}" oninput="ds()" style="font-size:18px;margin:10px 0"><div>${["Mal de tête","Dépression","Grippe","Insomnie","Allergies","Anxiété","Douleurs"].map(t=>`<span class="chip" onclick="qs('${t}')">${t}</span>`).join("")}</div><br><div id="res"></div>`}

/* LISTE */
function dl(){const f=nz($("lf").value),c=$("lc").value;$("ll").innerHTML=D.map((d,i)=>({d,i})).filter(x=>(!c||x.d[2]==c)&&(!f||nz(x.d[0]+" "+x.d[1]).includes(f))).sort((a,b)=>a.d[0].localeCompare(b.d[0],"fr")).map(x=>row(x.i)).join("")}
function liste(){const cl=[...new Set(D.map(d=>d[2]))].sort();setTimeout(dl,0);return `<h1>📚 Tous les médicaments</h1><div class="mu">${D.length} fiches</div><div class="card"><input id="lf" placeholder="Filtrer par nom ou marque…" oninput="dl()"><select id="lc" onchange="dl()"><option value="">Toutes les catégories</option>${cl.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div><div id="ll"></div>`}

/* FICHE */
function togMy(i){const n=D[i][0],k=S.my.indexOf(n);k<0?S.my.push(n):S.my.splice(k,1);save();render()}
function detail(i){const d=D[i],mine=S.my.includes(d[0]);
 return `<button class="s" onclick="det=null;render()">← Retour</button><h1>${esc(d[0])}</h1><div class="mu">${esc(d[1])}</div><div><span class="chip">${esc(d[2])}</span><span class="chip">${esc(d[9])}</span></div><br>
 <div class="card"><h2>⚠️ Effets secondaires courants</h2>${esc(d[4])}</div>
 <div class="card"><h2>⏳ À long terme</h2>${esc(d[5])}</div>
 <div class="card"><h2>🛡️ Précautions</h2>${esc(d[6])}</div>
 <div class="row"><button onclick="togMy(${i})">${mine?"✓ Dans ma liste":"⭐ Ajouter à ma liste"}</button><button class="s" onclick="sel=[${i}];det=null;tab='inter';render()">⚡ Interactions</button></div>`}

/* INTERACTIONS */
function chk(ids){const out=[];for(let a=0;a<ids.length;a++)for(let b=a+1;b<ids.length;b++){const A=D[ids[a]][8].split(" "),B=D[ids[b]][8].split(" ");R.forEach(r=>{if((A.includes(r[0])&&B.includes(r[1]))||(A.includes(r[1])&&B.includes(r[0])))out.push({a:ids[a],b:ids[b],l:r[2],t:r[3]})})}return out.sort((x,y)=>y.l-x.l)}
function showI(ids){if(ids.length<2)return '<div class="card mu">Choisis au moins deux éléments pour voir leurs interactions.</div>';const r=chk(ids);
 return (r.length?r.map(x=>`<div class="ix l${x.l}"><b>${esc(sn(x.a))} + ${esc(sn(x.b))}</b><span class="tag t${x.l}">${LV[x.l]}</span><div>${esc(x.t)}</div></div>`).join(""):'<div class="card">✅ Aucune interaction connue dans cette base entre ces éléments.</div>')+'<div class="mu">Cette base est limitée : l\'absence de résultat ne prouve pas l\'absence d\'interaction. Demande à ton pharmacien.</div>'}
function ts(i){const k=sel.indexOf(i);k<0?sel.push(i):sel.splice(k,1);drawI()}
function drawP(){const q=nz($("fi").value);$("pick").innerHTML=D.map((d,i)=>({d,i})).filter(x=>!q||nz(x.d[0]+" "+x.d[1]).includes(q)).slice(0,80).map(x=>`<span class="chip ${sel.includes(x.i)?"on":""}" onclick="ts(${x.i})">${esc(sn(x.i))}</span>`).join("")}
function drawI(){$("sel").innerHTML=sel.map(i=>`<span class="chip on" onclick="ts(${i})">${esc(sn(i))} ✕</span>`).join("")||'<span class="mu">Rien de choisi</span>';$("ires").innerHTML=showI(sel);drawP()}
function inter(){setTimeout(drawI,0);return `<h1>⚡ Interactions</h1><div class="mu">Choisis au moins deux médicaments, plantes ou substances (alcool, pamplemousse).</div><br><div class="card"><div id="sel"></div><div class="row"><button class="s" onclick="sel=S.my.map(n=>D.findIndex(d=>d[0]==n)).filter(i=>i>=0);drawI()">⭐ Ma liste</button><button class="s" onclick="sel=[];drawI()">Effacer</button></div></div><div id="ires"></div><div class="card"><input id="fi" placeholder="Filtrer…" oninput="drawP()"><div id="pick"></div></div>`}

/* LONG TERME */
function lg(o){org=o;render()}
function lgt(){const L=D.map((d,i)=>({d,i})).filter(x=>x.d[7].split(" ").includes(org));return `<h1>⏳ Risques à long terme</h1><div class="mu">Choisis un organe ou une fonction pour voir les médicaments concernés.</div><br><div class="card">${Object.entries(O).map(([k,v])=>`<span class="chip ${k==org?"on":""}" onclick="lg('${k}')">${v}</span>`).join("")}</div>${L.map(x=>`<div class="card" onclick="op(${x.i})"><b>${esc(x.d[0])}</b> <span class="chip">${esc(x.d[2])}</span><div class="mu" style="margin-top:6px">${esc(x.d[5])}</div></div>`).join("")||'<div class="card mu">Rien dans cette base.</div>'}`}

/* MA LISTE */
function addMy(){const n=D[+$("ma").value][0];if(!S.my.includes(n))S.my.push(n);save();render()}
function delMy(i){S.my=S.my.filter(n=>n!==D[i][0]);save();render()}
function my(){const ids=S.my.map(n=>D.findIndex(d=>d[0]==n)).filter(i=>i>=0),opts=D.map((d,i)=>[d[0],i]).sort((a,b)=>a[0].localeCompare(b[0],"fr"));
 return `<h1>⭐ Ma liste</h1><div class="mu">Tes médicaments : l'appli vérifie automatiquement leurs interactions. Les données restent sur ton téléphone.</div><br><div class="card"><select id="ma">${opts.map(o=>`<option value="${o[1]}">${esc(o[0])}</option>`).join("")}</select><button onclick="addMy()">Ajouter</button></div>${ids.map(i=>`<div class="card item" onclick="op(${i})"><div style="flex:1"><b>${esc(D[i][0])}</b><div class="mu">${esc(D[i][2])}</div></div><span class="chip" onclick="event.stopPropagation();delMy(${i})">Retirer</span></div>`).join("")}<h2>Interactions dans ma liste</h2>${showI(ids)}`}

/* AIDE */
function aide(){return `<h1>🆘 Aide et conseils</h1>
<div class="card"><a class="call" href="tel:144">📞 144 · Ambulance</a><a class="call" href="tel:112">📞 112 · Urgences</a><a class="call" href="tel:145">📞 145 · Tox Info Suisse (intoxication, médicament pris par erreur)</a><a class="call" href="tel:143">📞 143 · La Main Tendue (écoute 24h/24)</a></div>
<div class="card"><h2>Règles d'or</h2>${["Va toujours dans la même pharmacie : elle vérifie tes interactions.","Montre ta liste de médicaments à chaque rendez-vous médical.","Ne jamais arrêter brutalement : antidépresseurs, benzodiazépines, corticoïdes, bêtabloquants, antiépileptiques.","Plantes, compléments et alcool comptent aussi comme des « médicaments ».","Signale toujours tes allergies.","Garde les médicaments hors de portée des enfants et rapporte les périmés en pharmacie.","Pour les infos officielles : compendium.ch et swissmedic.ch."].map(t=>`<div class="item" style="cursor:default">• ${t}</div>`).join("")}</div>
<div class="card mu">MediGuide CH est un outil d'information personnel, pas une source officielle. Il ne remplace ni un médecin, ni un pharmacien, ni la notice de ton médicament.</div>`}
render();
</script>
</body>
</html>
